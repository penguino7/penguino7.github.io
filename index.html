<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin07 | CTF Writeups</title>
    <!-- Nhúng thư viện dịch Markdown sang HTML -->
    <script src="https://jsdelivr.net"></script>
    <!-- Nhúng thư viện làm đẹp highlight code block -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-sidebar: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-link: #58a6ff;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0; display: flex; height: 100vh; overflow: hidden;
        }
        .sidebar {
            width: 300px; background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column;
        }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); text-align: center; }
        .sidebar-header h2 { margin: 0; color: var(--text-link); font-size: 1.4rem; }
        .post-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .post-item { padding: 15px 20px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; }
        .post-item:hover { background-color: #21262d; }
        .post-item.active { background-color: #1f6feb33; border-left: 4px solid var(--text-link); }
        .post-title { font-weight: bold; font-size: 1rem; margin-bottom: 5px; color: var(--text-main); }
        .post-meta-side { font-size: 0.8rem; color: #8b949e; text-transform: uppercase; }
        .content-area { flex-grow: 1; padding: 40px; overflow-y: auto; }
        /* Style nội dung bài viết Markdown sau khi render */
        .markdown-body h1 { color: var(--text-link); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .markdown-body h2, .markdown-body h3 { color: #e6edf3; }
        .markdown-body code { font-family: monospace; background: #b1bac433; padding: 2px 6px; border-radius: 4px; color: #ff7b72; }
        .markdown-body pre code { background: none; color: inherit; padding: 0; }
        .markdown-body pre { background-color: #161b22; padding: 16px; border-radius: 6px; border: 1px solid var(--border-color); overflow: auto; }
        .markdown-body a { color: var(--text-link); text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- BÊN TRÁI: DANH SÁCH BÀI -->
    <div class="sidebar">
        <div class="sidebar-header"><h2>🐧 Penguin07 Blog</h2></div>
        <ul class="post-list" id="postList"></ul>
    </div>

    <!-- BÊN PHẢI: NỘI DUNG HIỂN THỊ -->
    <div class="content-area">
        <div id="contentArea" class="markdown-body">
            <p>Đang tải nội dung...</p>
        </div>
    </div>

    <script>
        // MENU QUẢN LÝ BÀI VIẾT: Khi có bài mới, bạn CHỈ CẦN KHAI BÁO tên file .md ở đây
        const writeups = [
            { fileName: "welcome.md", title: "Giới thiệu Blog", category: "General", date: "2026-08-21" },
            { fileName: "ctf-web-01.md", title: "Sanity Check - Web", category: "Web", date: "2026-08-20" },
            { fileName: "ctf-pwn-01.md", title: "Buffer Overflow Basic", category: "Pwn", date: "2026-08-19" }
        ];

        function renderSidebar() {
            const listContainer = document.getElementById('postList');
            listContainer.innerHTML = '';
            writeups.forEach((post, index) => {
                const li = document.createElement('li');
                li.className = `post-item ${index === 0 ? 'active' : ''}`;
                li.innerHTML = `
                    <div class="post-title">${post.title}</div>
                    <div class="post-meta-side">${post.category} - ${post.date}</div>
                `;
                li.onclick = () => loadMarkdownPost(post.fileName, li);
                listContainer.appendChild(li);
            });
        }

        // Hàm tự động đọc file .md từ thư mục 'posts/' rồi dịch sang HTML
        async function loadMarkdownPost(fileName, element) {
            if(element) {
                document.querySelectorAll('.post-item').forEach(item => item.classList.remove('active'));
                element.classList.add('active');
            }
            try {
                const response = await fetch(`./posts/${fileName}`);
                if (!response.ok) throw new Error("Không tìm thấy file bài viết.");
                const markdownText = await response.text();
                
                // Chuyển đổi Markdown -> HTML và kích hoạt highlight code
                document.getElementById('contentArea').innerHTML = marked.parse(markdownText);
                hljs.highlightAll();
            } catch (error) {
                document.getElementById('contentArea').innerHTML = `<h1>Lỗi</h1><p>${error.message}</p>`;
            }
        }

        // Chạy khởi tạo ban đầu
        renderSidebar();
        if(writeups.length > 0) {
            loadMarkdownPost(writeups[0].fileName, document.querySelector('.post-item'));
        }
    </script>
</body>
</html>
